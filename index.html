<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Andy He — Software &amp; Data Engineer</title>
    <meta name="description" content="Andy He is a Software/Data Engineer passionate about Big Data." />
    <meta name="color-scheme" content="light dark" />
    <!-- Two media-scoped values so the browser chrome is right on first paint; useTheme rewrites both once a theme is chosen. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1d1d1b" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050505" />
    <meta property="og:title" content="Andy He — Software &amp; Data Engineer" />
    <meta property="og:description" content="Andy He is a Software/Data Engineer passionate about Big Data." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apply the saved theme before first paint so there is no light/dark flash. ?theme=dark|light overrides for testing. -->
    <script>
      (function () {
        var theme = 'light'
        try {
          var fromUrl = new URLSearchParams(location.search).get('theme')
          var saved = localStorage.getItem('theme')
          if (fromUrl === 'dark' || fromUrl === 'light') theme = fromUrl
          else if (saved === 'dark' || saved === 'light') theme = saved
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..700&display=swap" />
    <!-- The hero sign's display face (--vandal in index.css), and the only non-Geist family
         on the site. Auditioned against Sedgwick Ave Display, Rubik Spray Paint, Rubik
         Distressed and Rock Salt in the block itself; this is the one that reads as
         hand-made without reading as a novelty. Its own <link> so it can be dropped in one
         line, and it is deliberately NOT one of the families the ASCII engine waits on —
         the engine's document.fonts.load() list is Geist and Geist Mono, which is what it
         rasterises and measures, so the sign's face can swap in late without touching it. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
